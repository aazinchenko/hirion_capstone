name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"   # every night 02:15 UTC (04:15 Zurich summer time, 03:15 winter)

jobs:
  public:
    name: Public suite (guest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/java:v1.55.0-noble
      options: --ipc=host
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: .m2/repository
          key: maven-${{ hashFiles('pom.xml') }}

      - name: Run public suite
        run: mvn -B -Dmaven.repo.local=.m2/repository -Dsuite=testng-public.xml test

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: public-traces
          path: target/traces/
          if-no-files-found: ignore

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-surefire-reports
          path: target/surefire-reports/

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-public
          path: target/allure-results/
          retention-days: 7

  journey:
    name: User journey (creates and deletes a real account)
    # one real account per run: only the manual button and the nightly schedule, never on push/PR
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: hirion-journey
      cancel-in-progress: false
    container:
      image: mcr.microsoft.com/playwright/java:v1.55.0-noble
      options: --ipc=host
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: .m2/repository
          key: maven-${{ hashFiles('pom.xml') }}

      - name: Run journey suite
        env:
          QA_MAILBOX: ${{ secrets.QA_MAILBOX }}
        # -Dqa.attachments=false: no screenshots or traces, they show the real test account
        run: mvn -B -Dmaven.repo.local=.m2/repository -Dsuite=testng-journey.xml "-Dqa.mailbox=$QA_MAILBOX" -Dqa.attachments=false test

      - name: Check that the test account was deleted
        if: always()
        run: |
          if [ -f .auth/test-user.json ]; then
            echo "::error::.auth/test-user.json still exists: the QA account may NOT be deleted. Find the email in the 'Run journey suite' log ([JourneyCleanup]) and delete the account by hand."
            exit 1
          fi
          echo "No leftover test user: account deleted by JourneyCleanup."

      - name: Mask the mailbox in the Allure results
        if: always()
        env:
          QA_MAILBOX: ${{ secrets.QA_MAILBOX }}
        run: |
          if [ -d target/allure-results ] && [ -n "$QA_MAILBOX" ]; then
            find target/allure-results -type f -exec sed -i "s/${QA_MAILBOX}/***/g" {} +
          fi

      # Only the Allure results leave this job: no screenshots or traces (-Dqa.attachments=false) and the
      # mailbox is masked. Surefire reports and traces stay here: they contain the real email.
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-journey
          path: target/allure-results/
          retention-days: 7

  report:
    name: Allure report on GitHub Pages
    needs: [public, journey]
    # also after failed tests (a red report is the point), but never for pull requests
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Download Allure results of this run
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Restore history from the published report (Trend)
        run: |
          mkdir -p allure-results/history
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -sfL "https://aazinchenko.github.io/hirion_capstone/history/$f" -o "allure-results/history/$f" \
              || rm -f "allure-results/history/$f"
          done
          ls allure-results/history

      - name: Set up Java for the Allure CLI
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate the report
        run: npx -y allure-commandline@2.46.1 generate allure-results --clean -o allure-report

      - name: Upload the report for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}