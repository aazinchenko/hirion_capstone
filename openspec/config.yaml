# openspec/config.yaml
schema: spec-driven

# Shown to the agent whenever it creates an artifact (proposal, specs, design, tasks).
context: |
  Product: an end-to-end test suite for hirion.ch (public landing page + signed-in user journey),
  capstone of the Agentic Engineering Crash Course.
  Stack: Java 21, Maven, Playwright for Java, TestNG. Tests live in src/test/java/ch/hirion/{pub,journey}.
  Specs describe what hirion.ch does in a browser; the implementation of a change is Playwright tests.
  Locators follow AGENTS.md. Known defects keep the correct SHALL in the spec; their tests are KNOWN BUG.
  Data: only the disposable TestUser (+hirion-qa-<timestamp>@). No real contact-form submits, no payments.
  Code, specs and commits are English. OpenSpec CLI: only `pnpm exec openspec`, never a bare `openspec`.

rules:
  specs:
    - Every scenario names the page, the user action and the exact visible text, URL or attribute
      expected, so a Playwright assertion can check it.
  tasks:
    - Scenario tests come first. The first task writes one TestNG test per spec scenario, runs it with
      mvn and quotes the failing lines; fixes follow.
    - The last task is "Run pnpm check and quote its summary line".